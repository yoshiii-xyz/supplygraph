[package]
name = "supplygraph"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Join local Rust dependency supply-chain evidence into deterministic reports"
license = "MIT"
repository = "https://github.com/yoshiii-xyz/supplygraph"
keywords = ["cargo", "supply-chain", "advisories", "licenses"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
